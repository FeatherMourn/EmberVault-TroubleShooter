name: Troubleshooter CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install module SDK
        run: python -m pip install "git+https://github.com/FeatherMourn/EmberVault-Module-SDK.git"
      - name: Run Troubleshooter tests
        run: python -m unittest -v tests/test_module.py
